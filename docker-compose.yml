services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hrleave_api

    expose:
      - "8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__HRLeaveConnectionString=Server=sqlserver;Database=LeaveManagementDb;User Id=sa;Password=Oluwadamilare@2026;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080

    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Oluwadamilare@2026

    ports:
      - "1400:1433"

    volumes:
      - sql_data:/var/opt/mssql
    
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Oluwadamilare@2026", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:latest

    container_name: nginx_proxy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - api

volumes:
  sql_data: