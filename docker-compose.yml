services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hrleave_api_1

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__HRLeaveConnectionString=Server=sqlserver;Database=LeaveManagementDb;User Id=sa;Password=Oluwadamilare@2026;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=admin
      - RabbitMq__Password=admin123

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hrleave_api_2

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__HRLeaveConnectionString=Server=sqlserver;Database=LeaveManagementDb;User Id=sa;Password=Oluwadamilare@2026;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=admin
      - RabbitMq__Password=admin123

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Oluwadamilare@2026

    ports:
      - "1400:1433"

    volumes:
      - sql_data:/var/opt/mssql
    
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Oluwadamilare@2026", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:latest

    container_name: nginx_proxy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - api1
      - api2

  redis:
    image: redis:7-alpine

    container_name: redis_cache

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    hostname: rabbitmq

    ports:
      - "5672:5672"        # port for communication
      - "15672:15672"      # port for Management UI
    
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123

    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5


volumes:
  sql_data: